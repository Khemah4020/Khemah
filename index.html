
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khemah</title>

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="stylesheet" href="style.css">

    <style>
        .contact-form {
            width: min(100%, 460px);
            margin-top: 28px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(15, 25, 17, 0.65);
            border: 1px solid rgba(67, 230, 107, 0.16);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            animation: formAppear 0.35s ease;
        }

        .contact-form[hidden] {
            display: none;
        }

        .contact-form label {
            margin-top: 8px;
            color: #8d968e;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 13px 15px;
            color: #f2f5ef;
            background: rgba(7, 9, 7, 0.65);
            border: 1px solid #1b251d;
            border-radius: 9px;
            outline: none;
            font: inherit;
            font-size: 13px;
            transition: border-color 0.25s ease;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #43e66b;
        }

        .contact-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: #626b63;
        }

        .contact-form button {
            margin-top: 12px;
            padding: 14px;
            color: #070907;
            background: #43e66b;
            border: none;
            border-radius: 9px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .contact-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 230, 107, 0.18);
        }

        .contact-form button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .form-status {
            color: #8d968e;
            font-size: 12px;
            line-height: 1.6;
        }

        @keyframes formAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .contact-form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="#" class="logo">
            Khemah<span>.</span>
        </a>
    </header>

    <main>

        <section id="home" class="hero">

            <div class="hero-glow"></div>
            <div class="hero-glow-secondary"></div>

            <div class="hero-content">

                <p class="hero-text">
                    <span class="brand-word">Khemah,</span>
                    <span class="main-copy">
                        A quiet space for ideas,<br>
                        creativity, and everything<br>
                        in between.
                    </span>
                </p>

            </div>

        </section>

        <section class="contact">

            <p class="eyebrow">
                CONTACT
            </p>

            <a
                href="#contact-form"
                class="email"
                id="email-toggle"
                aria-expanded="false"
                aria-controls="contact-form"
            >
                contactkhemah@gmail.com
                <span>↗</span>
            </a>

            <form
                class="contact-form"
                id="contact-form"
                action="https://formspree.io/f/moeekbbw"
                method="POST"
                hidden
            >

                <label for="sender-email">YOUR EMAIL</label>
                <input
                    type="email"
                    id="sender-email"
                    name="email"
                    placeholder="your@email.com"
                    required
                >

                <label for="message-subject">SUBJECT</label>
                <input
                    type="text"
                    id="message-subject"
                    name="subject"
                    placeholder="What's this about?"
                    required
                >

                <label for="message-content">MESSAGE</label>
                <textarea
                    id="message-content"
                    name="message"
                    placeholder="Write your message..."
                    required
                ></textarea>

                <input
                    type="text"
                    name="_gotcha"
                    style="display:none"
                    tabindex="-1"
                    autocomplete="off"
                >

                <button type="submit" id="send-button">
                    Send Message ↗
                </button>

                <p
                    class="form-status"
                    id="form-status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
